name: Run tests

env:
  # Enable colored output
  PY_COLORS: 1

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "tests/**"
      - "uv.lock"
      - "pyproject.toml"
      - ".github/workflows/**"

  # Run on all pull requests because these checks are required and will block merges otherwise
  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  run_tests:
    name: "Run tests: Python ${{ matrix.python-version }} on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13", "3.14"]
      fail-fast: false
    timeout-minutes: 5

    # PostgreSQL for the store backend's tests. Service containers run on Linux
    # runners only; an empty image skips the service, so the Windows jobs run
    # without one and those tests skip there. On Linux TEST_POSTGRES_REQUIRED
    # turns a skip into a failure, so a broken service cannot hide them.
    services:
      postgres:
        image: ${{ matrix.os == 'ubuntu-latest' && 'postgres:17' || '' }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      TEST_POSTGRES_REQUIRED: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # Run with frozen to use the current lockfile; static checks will determine if it needs updating
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest
